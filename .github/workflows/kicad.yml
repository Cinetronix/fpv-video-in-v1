name: KiCad CI

on:
  push:
    paths:
      - "**/*.kicad_sch"
      - "**/*.kicad_pcb"
      - "**/*.kicad_pro"
      - ".github/workflows/kicad.yml"
  pull_request:
    paths:
      - "**/*.kicad_sch"
      - "**/*.kicad_pcb"
      - "**/*.kicad_pro"
      - ".github/workflows/kicad.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TC9590XBG
            dir: TC9590XBG-PCB
            base: fpv-video-in-v1
          - name: DF56C-26S-breakout
            dir: DF56C-26S-breakout-board-PCB
            base: DF56C-26S-breakout-board
          - name: DF56C-30S-breakout
            dir: DF56C-30S-breakout-board-PCB
            base: DF56C-30S-breakout-board

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Run ERC
        continue-on-error: true
        uses: actions-for-kicad/kicad-actions@v1.6-k9.0.4
        with:
          schematic_file_name: ./${{ matrix.dir }}/${{ matrix.base }}.kicad_sch
          run_erc: true

      - name: Export schematic PDF
        uses: actions-for-kicad/kicad-actions@v1.6-k9.0.4
        with:
          schematic_file_name: ./${{ matrix.dir }}/${{ matrix.base }}.kicad_sch
          schematic_output_pdf: true

      - name: Run DRC
        continue-on-error: true
        uses: actions-for-kicad/kicad-actions@v1.6-k9.0.4
        with:
          pcb_file_name: ./${{ matrix.dir }}/${{ matrix.base }}.kicad_pcb
          run_drc: true

      - name: Export board PDFs
        uses: actions-for-kicad/kicad-actions@v1.6-k9.0.4
        with:
          pcb_file_name: ./${{ matrix.dir }}/${{ matrix.base }}.kicad_pcb
          pcb_output_pdf: true
          pcb_output_layers: "F.Cu,F.Silkscreen,F.Mask,B.Cu,B.Silkscreen,B.Mask,Edge.Cuts"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            *.erc
            *.drc
            *.rpt
            *.pdf
