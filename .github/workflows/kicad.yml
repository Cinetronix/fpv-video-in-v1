name: KiCad CI

on:
  push:
    paths:
      - "**/*.kicad_sch"
      - "**/*.kicad_pcb"
      - "**/*.kicad_pro"
      - ".github/workflows/kicad.yml"
  pull_request:
    paths:
      - "**/*.kicad_sch"
      - "**/*.kicad_pcb"
      - "**/*.kicad_pro"
      - ".github/workflows/kicad.yml"

jobs:
  kicad-ci:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:9.0
    strategy:
      matrix:
        include:
          - name: TC9590XBG
            dir: TC9590XBG-PCB
            base: fpv-video-in-v1
          - name: DF56C-26S-breakout
            dir: DF56C-26S-breakout-board-PCB
            base: DF56C-26S-breakout-board
          - name: DF56C-30S-breakout
            dir: DF56C-30S-breakout-board-PCB
            base: DF56C-30S-breakout-board

    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Run DRC
        continue-on-error: true
        env:
          BOARD_DIR: ${{ matrix.dir }}
          BOARD_BASE: ${{ matrix.base }}
        run: |
          kicad-cli pcb drc \
            --output "$BOARD_DIR/drc-report.json" \
            --format json \
            --severity-all \
            "$BOARD_DIR/$BOARD_BASE.kicad_pcb"

      - name: Run ERC
        continue-on-error: true
        env:
          BOARD_DIR: ${{ matrix.dir }}
          BOARD_BASE: ${{ matrix.base }}
        run: |
          kicad-cli sch erc \
            --output "$BOARD_DIR/erc-report.json" \
            --format json \
            --severity-all \
            "$BOARD_DIR/$BOARD_BASE.kicad_sch"

      - name: Export schematic PDF
        env:
          BOARD_DIR: ${{ matrix.dir }}
          BOARD_BASE: ${{ matrix.base }}
        run: |
          kicad-cli sch export pdf \
            --output "$BOARD_DIR/schematic.pdf" \
            "$BOARD_DIR/$BOARD_BASE.kicad_sch"

      - name: Export board PDF
        env:
          BOARD_DIR: ${{ matrix.dir }}
          BOARD_BASE: ${{ matrix.base }}
        run: |
          kicad-cli pcb export pdf \
            --output "$BOARD_DIR/board-front.pdf" \
            --layers "F.Cu,F.Silkscreen,F.Mask,Edge.Cuts" \
            --include-border-title \
            "$BOARD_DIR/$BOARD_BASE.kicad_pcb"
          kicad-cli pcb export pdf \
            --output "$BOARD_DIR/board-back.pdf" \
            --layers "B.Cu,B.Silkscreen,B.Mask,Edge.Cuts" \
            --include-border-title \
            "$BOARD_DIR/$BOARD_BASE.kicad_pcb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.dir }}/drc-report.json
            ${{ matrix.dir }}/erc-report.json
            ${{ matrix.dir }}/schematic.pdf
            ${{ matrix.dir }}/board-front.pdf
            ${{ matrix.dir }}/board-back.pdf
